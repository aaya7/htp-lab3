#A first workflow to play around with the editor
name: My First Workflow
on: 
  push:
    branches: 
      - main
  # workflow_dispatch: 
jobs:
  first_job:
    name: My first job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository Code
        uses: actions/checkout@v4
      - name: Display repository files
        run: tree
      
      - name: Change README Header using sed
        run: |
          echo "=== Modifying README Header ==="
          # This swaps any line starting with '#' to '# My Checkout'
          sed -i 's/^#.*/# My Checkout - Approved/' README.md
        shell: bash
       
      - name: Verify Modified README
        run: |
          echo "=== Checking current README contents ==="
          cat README.md
        shell: bash

      - name: Greet the user
        run: |
          echo "Hello world from ${{github.actor}}."
          echo "Current branch is ${{github.ref}}."
          echo "My API key will be ${{ secrets.APIKEY }}."
          echo "My secret will be ${{ vars.RAHSIA }}."
        env: 
          APIKEY: ${{ secrets.APIKEY }}
          RAHSIA: ${{ vars.RAHSIA }}
          
        shell: bash
